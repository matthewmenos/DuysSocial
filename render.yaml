services:
  # API Server (Express + Prisma)
  - type: web
    name: duys-api
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build -w server
    startCommand: npm start -w server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: API_PORT
        value: 5000
      - key: APP_URL
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
