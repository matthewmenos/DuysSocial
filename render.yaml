services:
  # Full-stack: Express API + React client served from one service
  - type: web
    name: duys
    runtime: node
    plan: starter
    # Both `build` and `build:prod` are equivalent: they run
    # scripts/prisma-setup.mjs, which selects the Prisma schema from the
    # DATABASE_URL scheme (file: -> sqlite, postgres:// -> derived postgres
    # schema) before generating the client and pushing the schema.
    buildCommand: npm install && npm run build -w server
    startCommand: npm start -w server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: API_PORT
        value: 5000
      - key: APP_URL
        value: https://duyssocial.onrender.com
      - key: CLIENT_ORIGIN
        value: https://duyssocial.onrender.com
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
