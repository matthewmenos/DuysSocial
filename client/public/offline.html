<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · DUYS</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 24px;
        text-align: center;
        background: #000;
        color: #e7e9ea;
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      h1 { margin: 0; font-size: 20px; }
      p { margin: 0; color: #71767b; }
      button {
        margin-top: 14px;
        padding: 10px 22px;
        border: 0;
        border-radius: 999px;
        background: #1d9bf0;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>You're offline</h1>
    <p>DUYS needs a connection. Check your network and try again.</p>
    <button type="button" onclick="location.reload()">Retry</button>
  </body>
</html>
